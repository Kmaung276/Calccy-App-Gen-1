name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Export Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Prepare Flutter Android Project & Build APK
        run: |
          cd flutter_app
          # Backup our complete custom main.dart so flutter create never overwrites it
          cp lib/main.dart /tmp/custom_main.dart.bak
          
          # Create Android platform configs with verified project name
          flutter create --platforms=android --org com.auracalc.app --project-name auracalc .
          
          # Restore our custom main.dart
          cp /tmp/custom_main.dart.bak lib/main.dart
          
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          flutter build apk --debug
          cd ..

      - name: Locate & Package APKs
        run: |
          mkdir -p release-output
          # Locate built APKs
          if [ -f "flutter_app/build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp flutter_app/build/app/outputs/flutter-apk/app-release.apk release-output/AuraCalc-v1.0.0-release.apk
          fi
          if [ -f "flutter_app/build/app/outputs/flutter-apk/app-debug.apk" ]; then
            cp flutter_app/build/app/outputs/flutter-apk/app-debug.apk release-output/AuraCalc-v1.0.0-debug.apk
          fi
          find flutter_app -name "*.apk" -type f -exec cp {} release-output/ \;
          echo "=== Built APK Artifacts ==="
          ls -lah release-output/

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraCalc-Android-APKs
          path: release-output/*.apk
          if-no-files-found: error
          retention-days: 30
